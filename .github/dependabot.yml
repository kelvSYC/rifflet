version: 2
# The gradle-build-conventions and kotlin-tools versions (gradle/libs.versions.toml) resolve from GitHub Packages,
# which needs credentials: the DEPENDABOT_PACKAGES_TOKEN Dependabot secret, a token with read:packages. kotlin-tools bumps arrive as ordinary Dependabot PRs; only gradle-build-conventions bumps
# are handled by .github/workflows/conventions-bump.yml.
registries:
  gradle-build-conventions:
    type: maven-repository
    url: https://maven.pkg.github.com/kelvSYC/gradle-build-conventions
    username: kelvSYC
    password: ${{ secrets.DEPENDABOT_PACKAGES_TOKEN }}
  kotlin-tools:
    type: maven-repository
    url: https://maven.pkg.github.com/kelvSYC/kotlin-tools
    username: kelvSYC
    password: ${{ secrets.DEPENDABOT_PACKAGES_TOKEN }}
updates:
  - package-ecosystem: gradle
    directory: /
    registries:
      - gradle-build-conventions
      - kotlin-tools
    # The Gradle wrapper follows the gradle-build-conventions release (.github/workflows/conventions-bump.yml).
    ignore:
      - dependency-name: "gradle-wrapper"
    # Dependabot holds back releases younger than a few days by default, and drops versions with no release date.
    # gradle-build-conventions and kotlin-tools releases are ours (the former gated by its canary and this repository's
    # CI), so they come at once.
    cooldown:
      default-days: 3
      exclude:
        - "com.kelvsyc.internal:*"
        - "com.kelvsyc.kotlin:*"
    schedule:
      interval: daily
      # A fixed time (UTC), so it is predictable when a gradle-build-conventions release gets its bump PR.
      time: "15:00"
    # The consumer compatibility fixture pins the oldest supported Gradle/Kotlin/JDK on purpose.
    exclude-paths:
      - "compat-tests/**"
  - package-ecosystem: github-actions
    directory: /
    # Dependabot holds back releases younger than a few days by default, and drops versions with no release date.
    cooldown:
      default-days: 3
    schedule:
      interval: daily
      time: "15:00"
