# Rifflet-specific entries only. Everything else (libraries, plugins, the platform) comes from the shared catalog
# that the com.kelvsyc.internal.settings plugin registers as `libs`; this file is registered as the `local` catalog
# (see gradle/settings) in every build that applies the rifflet settings plugin. The gradle/settings build itself
# has no shared plugin applied yet, so there it is the `libs` catalog and resolves the shared settings plugin.
# gradle-build-conventions pins the shared build conventions version once: the settings plugin's version determines
# the shared catalog and platform versions.
[versions]
gradle-build-conventions = "0.1.6"
kotlin-tools = "0.5.3"

[libraries]
conventions-settings-plugin = { module = "com.kelvsyc.internal:settings-plugin", version.ref = "gradle-build-conventions" }

# API Dependencies
# Explicit version (not just via the BOM): the shared platform is stripped from published metadata, so a
# versionless declaration would publish an unresolvable dependency.
kotlin-core = { module = "com.kelvsyc.kotlin:kotlin-core", version.ref = "kotlin-tools" }
